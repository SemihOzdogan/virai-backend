# Render Blueprint: API + private Ollama + managed PostgreSQL.
# All three resources must remain in the same region for private networking.
services:
  - type: web
    name: virai-api
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: node dist/db/migrate.js
    disk:
      name: uploads
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: virai-db
          property: connectionString
      - key: OLLAMA_HOSTPORT
        fromService:
          type: pserv
          name: virai-ollama
          property: hostport

  - type: pserv
    name: virai-ollama
    runtime: docker
    region: frankfurt
    plan: 1c-4g
    dockerfilePath: ./render/ollama.Dockerfile
    dockerContext: .
    disk:
      name: ollama-models
      mountPath: /models
      sizeGB: 10
    envVars:
      - key: OLLAMA_CHAT_MODEL
        value: qwen2.5:7b
      - key: OLLAMA_EMBEDDING_MODEL
        value: embeddinggemma-2:270m

databases:
  - name: virai-db
    region: frankfurt
    plan: 0.5c-1g
    databaseName: virai
    user: virai_app
    postgresMajorVersion: "16"
    diskSizeGB: 15
    ipAllowList: []
